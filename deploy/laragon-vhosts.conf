# Laragon includes this file after it is copied to etc/apache2/sites-enabled/scholar.conf.
# Keep 00-default.conf intact so unrelated localhost applications keep their current root.
<VirtualHost *:80>
    ServerName scholar.localhost
    DocumentRoot "C:/laragon/www/scholar/public"
    <Directory "C:/laragon/www/scholar/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
