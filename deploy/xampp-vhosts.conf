<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName scholar.localhost
    DocumentRoot "C:/xampp/htdocs/scholar proj/scholar/public"
    <Directory "C:/xampp/htdocs/scholar proj/scholar/public">
        Options -Indexes
        AllowOverride All
        Require local
    </Directory>
</VirtualHost>
